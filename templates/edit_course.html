{% extends "base.html" %}

{% block content %}

<div class="form-card">

    <h2 class="title">✏ Edit Course</h2>

    <p class="subtitle">
        Update your course information.
    </p>

    <form method="POST">

        <div class="form-group">

            <label>Course Name</label>

            <input
                type="text"
                name="name"
                value="{{ course.name }}"
                required>

        </div>

        <div class="form-group">

            <label>Course Color</label>

            <input
                type="color"
                name="color"
                value="{{ course.color }}">

        </div>

        <button class="btn blue">

            💾 Save Changes

        </button>

    </form>

</div>

{% endblock %}
