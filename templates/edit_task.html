{% extends "base.html" %}

{% block content %}

<div class="form-card">

    <h2 class="title">
        ✏ Edit Task
    </h2>

    <p class="subtitle">
        Course: {{ task.course.name }}
    </p>

    <form method="POST">

        <label>Task Title</label>

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required>

        <br><br>

        <label>Task Date</label>

        <input
            type="date"
            name="due_date"
            required>

        <br><br>

        <button
            type="submit"
            class="btn blue">

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
